<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEONPAY — Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05050a;
      --neon: #00ff88;
      --cyan: #00f0ff;
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Login */
    .login-wrap {
      width: 100%; max-width: 400px; padding: 24px;
    }
    .login-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px 32px;
      backdrop-filter: blur(20px);
      position: relative; overflow: hidden;
    }
    .login-box::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 50%);
      pointer-events: none;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem; font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--neon));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; margin-bottom: 8px;
    }
    .subtitle {
      text-align: center; font-size: 0.85rem; color: rgba(255,255,255,0.35);
      margin-bottom: 32px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: rgba(255,255,255,0.4); text-transform: uppercase;
      letter-spacing: 0.1em; margin-bottom: 8px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .field input {
      width: 100%; padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #fff; font-size: 1rem; font-family: 'Inter', sans-serif;
      outline: none; transition: border-color 0.3s, box-shadow 0.3s;
    }
    .field input:focus {
      border-color: var(--neon);
      box-shadow: 0 0 20px rgba(0,255,136,0.15);
    }
    .field input::placeholder { color: rgba(255,255,255,0.2); }
    .btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      cursor: pointer; font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; font-size: 1rem; letter-spacing: 0.02em;
      transition: transform 0.2s, box-shadow 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--neon), #00cc6a);
      color: #05050a;
      box-shadow: 0 0 20px rgba(0,255,136,0.25);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 40px rgba(0,255,136,0.4);
    }
    .btn-login {
      background: linear-gradient(135deg, var(--neon), #00cc6a);
      color: #05050a;
      box-shadow: 0 0 20px rgba(0,255,136,0.25);
    }
    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 40px rgba(0,255,136,0.4);
    }
    .error {
      color: #ff5555; font-size: 0.85rem; text-align: center;
      margin-top: 16px; display: none;
    }
    .error.show { display: block; }

    /* Dashboard */
    .dashboard { display: none; }
    .dashboard.active { display: block; }
    .login-wrap.hidden { display: none; }

    .success {
      color: var(--neon); font-size: 0.85rem; text-align: center;
      margin-top: 16px; display: none;
    }
    .success.show { display: block; }

    .hint {
      font-size: 0.75rem; color: rgba(255,255,255,0.25);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div class="login-wrap" id="loginWrap">
    <div class="login-box">
      <div class="logo">NEONPAY</div>
      <div class="subtitle">Admin Panel</div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="passwordInput" placeholder="Введите пароль" autofocus>
      </div>
      <button class="btn btn-login" onclick="tryLogin()">Войти</button>
      <div class="error" id="loginError">Неверный пароль</div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="login-wrap dashboard" id="dashboard">
    <div class="login-box">
      <div class="logo">NEONPAY</div>
      <div class="subtitle">Управление контактами</div>
      <div class="field">
        <label>WhatsApp номер</label>
        <input type="tel" id="whatsappInput" placeholder="351920225665">
        <div class="hint">Без пробелов и знаков. Пример: 351920225665</div>
      </div>
      <div class="field">
        <label>Telegram @username</label>
        <input type="text" id="telegramInput" placeholder="neonpay_pt">
        <div class="hint">Только юзернейм без @. Пример: neonpay_pt</div>
      </div>
      <button class="btn btn-primary" onclick="saveContacts()">Сохранить</button>
      <div class="success" id="saveSuccess">Контакты сохранены</div>
      <div class="error" id="saveError">Ошибка сохранения</div>
    </div>
  </div>

  <script>
    const PASSWORD = 'neon2026';

    function tryLogin() {
      const pw = document.getElementById('passwordInput').value;
      if (pw === PASSWORD) {
        document.getElementById('loginWrap').classList.add('hidden');
        document.getElementById('dashboard').classList.add('active');
        loadContacts();
      } else {
        document.getElementById('loginError').classList.add('show');
        setTimeout(() => document.getElementById('loginError').classList.remove('show'), 3000);
      }
    }

    document.getElementById('passwordInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryLogin();
    });

    function loadContacts() {
      const data = JSON.parse(localStorage.getItem('neonpay_contacts') || '{}');
      document.getElementById('whatsappInput').value = data.whatsapp || '';
      document.getElementById('telegramInput').value = data.telegram || '';
    }

    function saveContacts() {
      const whatsapp = document.getElementById('whatsappInput').value.replace(/[^0-9]/g, '');
      const telegram = document.getElementById('telegramInput').value.replace(/[^a-zA-Z0-9_]/g, '');
      localStorage.setItem('neonpay_contacts', JSON.stringify({ whatsapp, telegram }));
      document.getElementById('saveSuccess').classList.add('show');
      setTimeout(() => document.getElementById('saveSuccess').classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
